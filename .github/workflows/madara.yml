name: Madara Website Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test-website:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show project files
        run: |
          echo "=============================="
          echo " MADARA WEBSITE FILES"
          echo "=============================="

          find . -maxdepth 3 -type f


      - name: Check HTML
        run: |
          test -f index.html
          echo "✓ index.html exists"


      - name: Check CSS
        run: |
          test -f style.css
          echo "✓ style.css exists"


      - name: Check JavaScript
        run: |
          test -f script.js
          echo "✓ script.js exists"


      - name: Check images
        run: |
          test -f assets/madara-battle.webp
          test -f assets/tailed-beasts.jpg
          test -f assets/madara-eyes.webp
          test -f assets/madara-red.webp

          echo "✓ All Madara images exist"


      - name: Check workflow
        run: |
          test -f .github/workflows/test.yml
          echo "✓ GitHub Actions workflow exists"


      - name: Website test passed
        run: |
          echo ""
          echo "======================================"
          echo "     MADARA WEBSITE TEST PASSED"
          echo "======================================"
          echo ""
          echo "The Uchiha has approved your code."
