name: Death Note Website Test

on:
  push:
    branches:
      - main

jobs:
  test-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML
        run: |
          test -f index.html
          echo "HTML file found!"

      - name: Check CSS
        run: |
          test -f style.css
          echo "CSS file found!"

      - name: Check JavaScript
        run: |
          test -f script.js
          echo "JavaScript file found!"

      - name: Website test successful
        run: |
          echo "=============================="
          echo " DEATH NOTE WEBSITE TEST PASSED "
          echo "=============================="
