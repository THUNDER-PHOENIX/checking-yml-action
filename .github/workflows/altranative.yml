# project-config.yml
project:
  name: "Madara Uchiha Tribute"
  version: "2.0.0"
  description: "A fan-made interactive tribute website for the Ghost of the Uchiha."
  author: "Naruto Fan Community"

assets:
  fonts:
    - family: "Cinzel"
      weights: [400, 600, 800, 900]
    - family: "Rajdhani"
      weights: [400, 600, 700]
  images:
    - file: "OIP.webp"
      alt: "Madara Uchiha artwork"
      usage: "Hero Section"
    - file: "OIP (1).webp"
      alt: "Madara battlefield artwork"
      usage: "Full Image Break / War Section"
    - file: "naruto-tailed-beasts.jpg"
      alt: "Naruto tailed beasts artwork"
      usage: "Tailed Beasts Section"
    - file: "madara2.webp"
      alt: "Madara close up sharingan"
      usage: "Roast Section Target"
    - file: "madara.webp"
      alt: "Wake up to reality"
      usage: "Footer Emblem"

build:
  html: "index.html"
  css: "style.css"
  javascript: "script.js"
  theme_colors:
    primary_red: "#ff1717"
    dark_blood: "#360000"
    abyss_black: "#030303"
    text_white: "#eeeeee"
